# ─────────────────────────────────────────────
# publications.yml
# To add a publication: copy one block, paste it anywhere in the list, edit, commit.
# The site sorts by `date` (newest first), so order in this file does not matter.
#
# Fields
#   id        unique slug, used for the BibTeX key and the copy buttons
#   title     full title
#   authors   list, in order. Your own name must be written exactly as
#             "cite_name" in profile.yml so it gets bolded.
#   venue     journal / conference / repository name
#   date      YYYY-MM-DD (day can be 01 if unknown)
#   type      journal | preprint | presentation
#   status    published | review   (review = gold badge, e.g. "In Revision")
#   doi       DOI only, e.g. 10.1002/htj.70387 (leave "" if none)
#   url       link for the "Read" button (leave "" if none)
#   logo      short text for the little venue tile
#   logo_sub  tiny caption under it
#   keywords  list, used by the search box
#
# type "presentation" is NOT counted in the "Publications" number on the home
# page; it is counted separately as "Conference Presentation".
# ─────────────────────────────────────────────

