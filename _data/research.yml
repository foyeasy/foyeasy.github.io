experience:
  - id: thesis
    period: "Feb 2024 – Jul 2025"
    title: "Undergraduate Thesis"
    institution: "Mechanical Engineering, Shahjalal University of Science and Technology"
    logo: /Assets/Logo/SUST logo.png
    project: "Enhancing Cutting Tool Durability by Addressing Thermal Effects: A Numerical Study."
    supervisor_label: "Supervisor"
    supervisor: "MD. MAHMUD-OR-RASHID, Assistant Professor, Mechanical Engineering, SUST"
    bullets:
      - "Investigated conjugate heat transfer in cutting inserts using COMSOL Multiphysics to minimize thermal effects and enhance tool life."
      - "Introduced two key cutting parameters: the angle of attack of the coolant and the insert hole size."
      - "Modeled a non-conventional cutting insert with a conductive core to reduce cutting temperature."
      - "This research resulted in <strong>three</strong> publications in both a journal and a conference proceedings."
    images:
