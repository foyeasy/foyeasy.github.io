# ── 3. PROJECTS (Work page) ──────────────────
# images: list of {src, alt}. A project with no `description` and no `highlights`
# (like CAD Projects) simply shows its image gallery.
projects:
  - id: am-qc
    title: "Predictive ML Framework for AM Quality Control"
    tags: [Gradient Boosting, SMOTE, SHAP]
    description: >-
      Developed a prescriptive ML framework that ensures print success of
      Additive Manufacturing (AM) parts by predicting necessary real-time
      process adjustments (Feed/Speed) with 99.6% accuracy, preventing defects
      before they occur.
    highlights_title: "Key Technical Highlights"
    highlights:
      - label: "Leakage Prevention"
        text: >-
          To ensure real-time viability, I identified and removed "leaking"
          features like quality_score and dimensional_accuracy, which are only
          available after a print is finished.
      - label: "Feature Engineering"
        text: >-
          Analysis revealed that Process Stability (38.9%), Temperature
          Variance (31.2%), and Vibration Levels (17.6%) are the primary
          drivers of quality.
      - label: "Industrial Readiness"
        text: >-
          The model features a 0.8 ms prediction time, making it ideal for
          edge-computing deployments in Industry 4.0 environments.
      - label: "Advanced Preprocessing"
        text: >-
          Used SMOTE to resolve class imbalance and SHAP analysis to map model
          predictions back to the underlying physics of 3D printing.
    images:
      - { src: /Assets/Projects/AMQC01.png, alt: "AM quality control model: overview" }
      - { src: /Assets/Projects/AMQC02.png, alt: "AM quality control model: performance metrics" }
      - { src: /Assets/Projects/AMQC03.png, alt: "AM quality control model: SHAP analysis" }
      - { src: /Assets/Projects/AMQC04.png, alt: "AM quality control model: feature importance" }

  - id: sonar-slam
    title: "Sonar SLAM (Simultaneous Localization And Mapping)"
    tags: [ROS2, RViz2, Gazebo]
    description: >-
      Developed a cost-effective indoor mobile robot that creates 2D maps and
      performs navigation using ultrasonic sonar sensors instead of expensive
      LiDAR. It aims to implement SLAM algorithm with map adjustment technique
      to achieve accurate localization and mapping while minimizing complexity.
      The robot will also feature obstacle avoidance capabilities.
    images:
      - { src: /Assets/Projects/SS01.jpg, alt: "Sonar SLAM robot: hardware build" }
      - { src: /Assets/Projects/SS02.jpg, alt: "Sonar SLAM robot: sensor layout" }
      - { src: /Assets/Projects/SS04.jpg, alt: "Sonar SLAM robot: generated 2D map" }

  - id: rough-terrain
    title: "Autonomous Rough Terrain Robot"
    tags: [ROS2, RViz2, Gazebo]
    description: >-
      An autonomous vehicle is designed for rough terrains. It exhibits dynamic
      stability during locomotion over uneven landscapes. This system
      incorporates LiDAR mapping for navigation across various levels within
      civil infrastructure layouts. Employing a rocker-bogie mechanism ensures
      upright stability in challenging terrains and facilitates ascending
      inclines, such as stairs.
    images:
      - { src: /Assets/Projects/RT02.png, alt: "Rough terrain robot: rocker-bogie mechanism" }
      - { src: /Assets/Projects/RT01.png, alt: "Rough terrain robot: simulation view" }

  - id: covid-dhaka
    title: "Spread of COVID-19 in Dhaka City"
    tags: [MATLAB, ODE]
    description: >-
      Developed a mathematical model to simulate the spread of COVID-19 in
      Dhaka City, Bangladesh, and to use numerical analysis techniques to solve
      the system of ODEs using MATLAB that describe the dynamics of the
      disease. The model takes into account factors such as population size,
      infection rates, recovery rates, and mortality rates, and it provides
      insights into how various interventions and control measures can affect
      the spread of the disease.
    images:
      - { src: /Assets/Projects/MAT01.jpg, alt: "COVID-19 spread model: simulated infection curves" }

  - id: cad
    title: "CAD Projects"
    tags: [SolidWorks, Fusion360, Keyshot]
    description: ""
    images:
