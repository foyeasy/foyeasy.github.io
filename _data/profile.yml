summary: >-
  Exploring additive manufacturing, materials characterization and thermal
  management in advanced machining. Combining multi-physics simulation,
  control systems, and machine learning to bridge design, fabrication, and
  in-situ process control.

research_vision: >-
  My research vision centers on closing the gap between computational design
  and physical fabrication in advanced manufacturing. While investigating
  thermal degradation in metal cutting, I demonstrated that embedding
  conductive architectures into cutting inserts could reduce peak temperatures
  by over 50%. However, conventional machining restricts the fabrication of
  such topology-optimized, multi-material geometries. This limitation
  redirected my focus toward additive manufacturing (AM) as an enabling
  platform to materialize computationally derived designs with tailored
  thermal, mechanical, and functional properties. My ultimate research goal in
  the long run is to focus on interdisciplinary collaborations across design,
  modeling, and fabrication,
vision_emphasis: >-
  specifically in the development of novel smart materials enabled by hybrid
  additive manufacturing processes.

